[package]
name = "asset-tracking-program"
version = "2.0.0"
edition = "2021"
authors = ["hankyleisplay"]
description = "資產追蹤系統 v2.0 (Asset Tracking Program) - 電腦與手機雙向同步、自動更新、主題配色與財富管理平台"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
incremental = false

[profile.release]
incremental = false
