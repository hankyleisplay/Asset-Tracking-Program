<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Growth Line & Arrow Gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Shield / Vault Glass Fill -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Cube Top Gradient -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Cube Left Gradient -->
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Cube Right Gradient -->
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Glow Filter for Neon Accents -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Top Highlight Glare -->
    <radialGradient id="glare" cx="30%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>

  <!-- Glass Rim Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Background Decorative Ambient Circles -->
  <circle cx="130" cy="140" r="90" fill="#38bdf8" opacity="0.08" filter="url(#neonGlow)"/>
  <circle cx="390" cy="370" r="110" fill="#8b5cf6" opacity="0.1" filter="url(#neonGlow)"/>
  <circle cx="380" cy="130" r="80" fill="#10b981" opacity="0.09" filter="url(#neonGlow)"/>

  <!-- Subtle Financial Grid Lines -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="80" y1="180" x2="432" y2="180"/>
    <line x1="80" y1="260" x2="432" y2="260"/>
    <line x1="80" y1="340" x2="432" y2="340"/>
    <line x1="160" y1="100" x2="160" y2="412"/>
    <line x1="256" y1="100" x2="256" y2="412"/>
    <line x1="352" y1="100" x2="352" y2="412"/>
  </g>

  <!-- Central Asset Shield / Safe Container (Local Vault Concept) -->
  <path d="M 256,92 
           C 340,92 384,124 384,180 
           C 384,286 280,360 256,380 
           C 232,360 128,286 128,180 
           C 128,124 172,92 256,92 Z" 
        fill="url(#shieldGrad)" 
        stroke="rgba(255, 255, 255, 0.22)" 
        stroke-width="2.5"/>

  <!-- Inner Subtle Shield Accent -->
  <path d="M 256,116 
           C 324,116 360,142 360,188 
           C 360,270 274,332 256,350 
           C 238,332 152,270 152,188 
           C 152,142 188,116 256,116 Z" 
        fill="none" 
        stroke="#818cf8" 
        stroke-width="1.5" 
        opacity="0.35"/>

  <!-- 3D Isometric Asset Cube (Bottom-Left: Physical Hardware / Real Assets) -->
  <g transform="translate(148, 260)">
    <!-- Top Face -->
    <polygon points="40,0 80,20 40,40 0,20" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="0,20 40,40 40,84 0,64" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <polygon points="40,40 80,20 80,64 40,84" fill="url(#cubeRight)"/>
    <!-- Edge Highlight -->
    <polyline points="0,20 40,40 80,20" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Stock & Valuation Bar Pillars in Background of Shield -->
  <rect x="236" y="240" width="16" height="70" rx="4" fill="#3b82f6" opacity="0.4"/>
  <rect x="264" y="200" width="16" height="110" rx="4" fill="#8b5cf6" opacity="0.45"/>
  <rect x="292" y="165" width="16" height="145" rx="4" fill="#10b981" opacity="0.5"/>

  <!-- Dynamic Glowing Stock Growth Curve / Trend Vector Line -->
  <!-- Passes through the asset cube and bursts upward through the shield -->
  <path d="M 108,358 
           C 156,358 178,312 216,300 
           C 254,288 280,224 330,195 
           C 365,175 390,140 406,120" 
        fill="none" 
        stroke="url(#growthGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <path d="M 108,358 
           C 156,358 178,312 216,300 
           C 254,288 280,224 330,195 
           C 365,175 390,140 406,120" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- High-Tech Arrowhead (Surging Upward) -->
  <path d="M 378,114 L 418,112 L 412,152 Z" 
        fill="#34d399" 
        stroke="#ffffff" 
        stroke-width="2" 
        filter="url(#softGlow)"/>

  <!-- Data Nodes on the Trend Line -->
  <!-- Node 1 -->
  <circle cx="188" cy="280" r="9" fill="#0284c7" stroke="#ffffff" stroke-width="3" filter="url(#softGlow)"/>
  <!-- Node 2 (Center Pivot) -->
  <circle cx="272" cy="246" r="11" fill="#6366f1" stroke="#ffffff" stroke-width="3.5" filter="url(#softGlow)"/>
  <!-- Node 3 (Peak) -->
  <circle cx="348" cy="182" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Top Glass Sheen / Reflection -->
  <path d="M 20,20 
           L 492,20 
           C 492,20 380,220 256,220 
           C 132,220 20,20 20,20 Z" 
        fill="url(#glare)" 
        clip-path="url(#roundedClip)"/>

  <!-- Clip path to match squircle -->
  <clipPath id="roundedClip">
    <rect x="20" y="20" width="472" height="472" rx="112"/>
  </clipPath>
</svg>
