plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hankyle.assettracking'
    compileSdk 34

    defaultConfig {
        applicationId "com.hankyle.assettracking"
        minSdk 24
        targetSdk 34
        versionCode 200
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
